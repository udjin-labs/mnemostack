[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemostack"
version = "2.0.1"
description = "Self-hosted hybrid memory & retrieval for AI apps: semantic + BM25 + temporal + graph recall over Qdrant/Memgraph, RRF fusion, 8-stage ranking, multi-tenant filters, answer synthesis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "mnemostack contributors"},
]
keywords = ["memory", "ai", "agent", "chatbot", "rag", "knowledge-base", "qdrant", "memgraph", "retrieval", "bm25", "embeddings"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "qdrant-client>=1.14.3,<2",  # HasVectorCondition import needs 1.13; local-mode update_vectors fixed in 1.14.3 (1.13.x-1.14.2 fail the sparse backfill)
    "neo4j>=5.15,<7",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
    "httpx>=0.24,<1",
    "markdown-it-py>=3.0,<5",
]

[project.optional-dependencies]
gemini = []
ollama = []
huggingface = [
    "transformers>=4.51",
    "torch>=2.0",
]
mcp = [
    "fastmcp>=0.2",
    "pydantic>=2.5,<3",
]
server = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.5,<3",
]
watch = [
    "watchdog>=3,<7",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4",
    "ruff>=0.1",
    "mypy>=1.7",
    "types-PyYAML",
    "fastapi>=0.110,<1",
    "httpx>=0.24,<1",
]

[project.scripts]
mnemostack = "mnemostack.cli:main"

[project.urls]
Homepage = "https://github.com/udjin-labs/mnemostack"
Repository = "https://github.com/udjin-labs/mnemostack"
Issues = "https://github.com/udjin-labs/mnemostack/issues"
Changelog = "https://github.com/udjin-labs/mnemostack/blob/main/CHANGELOG.md"
# Issues = "https://github.com/YOUR_ORG/mnemostack/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# W391 (blank line at EOF) is a ruff PREVIEW rule, so the "W" prefix alone
# doesn't activate it. explicit-preview-rules keeps preview mode from pulling
# in every other preview rule via the prefixes — only the ones named here.
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "B", "UP", "W391"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Preview-mode F822 doesn't recognize the package's lazy PEP 562 re-exports
# (__getattr__): every name in __all__ resolves at runtime, so these are
# false positives, not missing exports.
"src/mnemostack/__init__.py" = ["F822"]

[tool.mypy]
# 3.12, not our 3.10 floor: numpy >= 2.5 ships PEP 695 `type` statements in
# its stubs, which mypy refuses to parse under python_version < 3.12 and
# aborts the whole run. 3.10 runtime compatibility is covered by the CI test
# matrix (3.10-3.13), not by mypy's stdlib gating.
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

# mcp/server.py guards its fastmcp import with try/except ImportError and a
# `FastMCP = None  # type: ignore` fallback. Whether that ignore is "used"
# depends on whether fastmcp is installed, so unused-ignore checking would
# make the mypy verdict vary by environment. Exempt just this module.
[[tool.mypy.overrides]]
module = "mnemostack.mcp.server"
warn_unused_ignores = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "smoke: minimal end-to-end 'does the stack work' checks (run: pytest tests/test_smoke.py)",
]
