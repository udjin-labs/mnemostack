name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src/ tests/ benchmarks/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,mcp,server]'
      - name: Mypy
        run: mypy src/mnemostack

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Pytest
        run: pytest -q --cov=mnemostack --cov-report=term-missing

  test-min-deps:
    # The dependency FLOOR must actually work: this job pins qdrant-client to
    # the exact declared minimum so a floor drifting below reality (imports or
    # local-mode behavior) fails CI instead of a user install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with minimum qdrant-client
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install 'qdrant-client==1.14.3'
      - name: Pytest (minimum deps)
        run: pytest -q

  test-qdrant-server:
    # Real-server smoke: the in-memory local client cannot represent payload
    # full-text indexes, update_collection refusals, or update_vectors — so
    # the text-search release scenarios replay here against real servers.
    # BOTH sides of the pair are PINNED: a floating client silently drifts
    # into officially-unsupported client/server combinations (minor-version
    # difference > 1) and turns the smoke into a non-reproducible check.
    # Pairs: the declared client MINIMUM against the newest server in its
    # support window, that server with its version-ALIGNED client, and the
    # docs-pinned current server with its aligned client.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: v1.15.4   # newest server the minimum client supports
            client: 1.14.3    # declared dependency minimum
          - server: v1.15.4
            client: 1.15.1    # version-aligned with that server
          - server: v1.18.3   # deployment docs' compose pin
            client: 1.18.0    # version-aligned with that server
    services:
      qdrant:
        image: qdrant/qdrant:${{ matrix.server }}
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (pinned qdrant-client ${{ matrix.client }})
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install 'qdrant-client==${{ matrix.client }}'
      - name: Real-server smoke tests
        env:
          MNEMOSTACK_TEST_QDRANT_URL: http://localhost:6333
        run: pytest tests/test_qdrant_server_smoke.py -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install --upgrade build 'twine>=6.0'
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7
